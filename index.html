<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papas Tocomia - Play Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121214;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            margin-bottom: 15px;
            font-size: 24px;
            letter-spacing: 0.5px;
        }
        .game-container {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 4 / 3;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        #ruffle-player {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <h1>Papas Tocomia</h1>

    <div class="game-container">
        <!-- Ruffle Container -->
        <div id="ruffle-player"></div>
    </div>

    <!-- Ruffle Emulator Script -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("DOMContentLoaded", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            document.getElementById("ruffle-player").appendChild(player);
            
            // Aynı klasördeki SWF dosyasını yüklüyoruz
            player.load("papastacomia.swf");
        });
    </script>
</body>
</html>
